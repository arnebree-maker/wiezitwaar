<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wie zoek je? Algemene diensten | Sint-Rembert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blauw:#06038D; --groen:#95D600; --wit:#FFFFFF; --grijs:#D9D9D9;
    --font:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
    --top:68px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--blauw);background:var(--wit);font-size:16px;line-height:1.45}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--groen);outline-offset:2px}
  mark{background:var(--groen);color:var(--blauw);border-radius:4px;padding:0 2px}

  /* ================= STARTPAGINA ================= */
  .start{min-height:100vh;background:var(--blauw);color:var(--wit);display:flex;justify-content:center;padding:7vh 24px 48px}
  .start-binnen{width:100%;max-width:900px}
  .kop{display:flex;align-items:center;gap:18px}
  .kop img{width:56px;height:auto;flex:none}
  .kop .boven{margin:0;font-weight:600;font-size:16px}
  .kop h1{margin:0;font-size:clamp(1.9rem,6vw,3.2rem);line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
  .chev{margin-left:auto;width:84px;flex:none}

  .keuze{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:34px 0 22px}
  .keuze button{border:2px solid var(--wit);background:transparent;color:var(--wit);border-radius:28px;padding:16px 20px;text-align:left;cursor:pointer}
  .keuze button b{display:block;font-size:19px;font-weight:800;line-height:1.15}
  .keuze button span{font-size:14px;font-weight:500}
  .keuze button[aria-pressed="true"]{background:var(--groen);border-color:var(--groen);color:var(--blauw)}

  .veld{position:relative}
  .veld input{width:100%;padding:18px 24px;border-radius:999px;border:3px solid transparent;font:inherit;font-size:20px;font-weight:500;color:var(--blauw);background:var(--wit)}
  .veld input::placeholder{color:#6b69b8}
  .veld input:focus{outline:none;border-color:var(--groen)}
  .voorstel{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--wit);color:var(--blauw);border:2px solid var(--grijs);border-radius:24px;
    list-style:none;margin:0;padding:6px;z-index:30;max-height:min(60vh,440px);overflow:auto}
  .voorstel li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 14px;border-radius:16px;cursor:pointer}
  .voorstel li b{font-weight:700;display:block}
  .voorstel li small{font-size:14px}
  .voorstel li .plek{font-size:13px;white-space:nowrap;text-align:right}
  .voorstel li[aria-selected="true"]{background:var(--blauw);color:var(--wit)}
  .voorstel .niets{cursor:default}
  .hint{margin:14px 4px 0;font-size:15px;font-weight:500}

  .diensten{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .gebouwkop{grid-column:1/-1;margin:18px 0 0;font-size:14px;font-weight:700;text-transform:uppercase}
  .dienst{border:2px solid var(--wit);background:transparent;color:var(--wit);border-radius:22px;padding:13px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .dienst:hover{background:var(--wit);color:var(--blauw)}
  .dienst b{font-weight:700;font-size:16px;line-height:1.25}
  .dienst span{font-size:13px}

  /* vraagmodus */
  .onderwerpen{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
  .onderwerpen button{border:2px solid var(--wit);background:transparent;color:var(--wit);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .onderwerpen button[aria-pressed="true"],.onderwerpen button:hover{background:var(--wit);color:var(--blauw)}
  .resultaten{display:grid;gap:12px;margin-top:20px}
  .resultaat{background:var(--wit);color:var(--blauw);border-radius:28px;padding:18px 22px}
  .resultaat h3{margin:0 0 6px;font-size:16px;font-weight:800;text-transform:uppercase;line-height:1.25}
  .resultaat p{margin:0 0 12px;font-size:15px}
  .geenres{margin:8px 4px;font-weight:500}

  /* ================= KAARTSCHERM ================= */
  .scherm{height:100vh;display:grid;grid-template-rows:var(--top) 1fr;background:var(--wit)}
  .top{background:var(--blauw);color:var(--wit);display:flex;align-items:center;gap:16px;padding:0 20px}
  .top img{width:34px;height:auto;flex:none}
  .terug{border:2px solid var(--wit);background:none;color:var(--wit);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
  .terug:hover{background:var(--wit);color:var(--blauw)}
  .plaats{flex:1;min-width:0}
  .plaats h2{margin:0;font-size:19px;line-height:1.15;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plaats p{margin:2px 0 0;font-size:14px;font-weight:500}
  .top .veld{width:340px}
  .top .veld input{padding:9px 16px;font-size:15px;border-width:2px}
  .top .voorstel{left:auto;width:430px;max-width:92vw}

  .kaart{position:relative;min-height:0;overflow:hidden;background:var(--wit)}
  .kaart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .zone{fill:transparent;cursor:pointer;stroke:transparent;stroke-width:3}
  .zone:hover{stroke:var(--blauw);stroke-dasharray:8 5}
  .zone.gekozen{stroke:var(--blauw);stroke-width:6;stroke-dasharray:none;fill:rgba(149,214,0,.3)}
  .leeg .zone{fill:rgba(149,214,0,.18);stroke:var(--blauw);stroke-width:1.5}
  .etiket-rand{fill:none;stroke:var(--groen);stroke-width:7}
  .ring{fill:none;stroke:var(--blauw);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:puls 1.6s ease-out 3 forwards}
  @keyframes puls{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.5)}}

  .lift{position:absolute;top:14px;left:14px;display:flex;gap:10px;background:var(--wit);border:2px solid var(--grijs);border-radius:22px;padding:10px 12px;z-index:5}
  .schacht{display:flex;flex-direction:column;align-items:center;gap:6px}
  .schacht + .schacht{border-left:2px solid var(--grijs);padding-left:10px}
  .knoppen{display:flex;flex-direction:column;gap:4px}
  .vloer{width:36px;height:36px;border-radius:50%;border:2px solid var(--blauw);background:var(--wit);color:var(--blauw);font-weight:800;font-size:16px;cursor:pointer;position:relative}
  .vloer[aria-pressed="true"]{background:var(--blauw);color:var(--wit)}
  .vloer.doel::after{content:"";position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--groen);border:2px solid var(--blauw)}
  .schacht span{font-size:12px;font-weight:600;text-align:center;line-height:1.15;max-width:80px}

  .kleuren{position:absolute;top:14px;right:14px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .kleuren > button{border:2px solid var(--grijs);background:var(--wit);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:600}
  .kleuren ul{list-style:none;margin:0;padding:12px 14px;background:var(--wit);border:2px solid var(--grijs);border-radius:20px;font-size:14px}
  .kleuren li{padding:2px 0}
  .kleuren i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}

  /* infokaart */
  .kaartje{position:absolute;bottom:16px;width:min(450px,calc(100% - 32px));background:var(--wit);border:2px solid var(--grijs);border-left:8px solid var(--groen);
    border-radius:28px;padding:18px 20px 18px 22px;z-index:6;max-height:calc(100% - 190px);overflow:auto}
  .kaartje.links{left:16px}.kaartje.rechts{right:16px}
  .kaartje h3,.fiche h3{margin:0;font-size:19px;font-weight:800;text-transform:uppercase;line-height:1.2;padding-right:34px}
  .waar{margin:3px 0 12px;font-size:14px;font-weight:500}
  .dicht{position:absolute;top:12px;right:12px;width:32px;height:32px;border:2px solid var(--blauw);border-radius:50%;background:var(--wit);color:var(--blauw);cursor:pointer;font-size:18px;line-height:1;font-weight:700}
  .groep + .groep{margin-top:14px;padding-top:12px;border-top:2px solid var(--grijs)}
  .groep h4{margin:0 0 6px;font-size:13px;font-weight:800;text-transform:uppercase}
  .kaartje ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  .kaartje ul.een{grid-template-columns:1fr}
  .kaartje li button{border:0;background:none;padding:5px 8px;margin:-5px -8px;border-radius:14px;text-align:left;cursor:pointer;width:100%}
  .kaartje li button:hover{background:var(--blauw);color:var(--wit)}
  .kaartje li b{display:block;font-weight:700;line-height:1.25}
  .kaartje li small{font-size:13px;line-height:1.25;display:block}
  details.info{margin:0 0 10px}
  details.info summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--blauw);border-radius:999px;padding:3px 12px}
  details.info summary::-webkit-details-marker{display:none}
  details.info summary::after{content:"+";font-weight:800}
  details.info[open] summary::after{content:"–"}
  details.info p{margin:8px 0 0;font-size:14px}
  .tip{margin:0 0 10px;font-size:13px;font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--blauw);background:var(--wit);color:var(--blauw);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:600}
  .chip:hover{background:var(--blauw);color:var(--wit)}
  .noot{margin:12px 0 0;font-size:13px}
  .open-kaartje{position:absolute;bottom:16px;left:16px;z-index:6;border:0;background:var(--blauw);color:var(--wit);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600}

  /* persoonsweergave */
  .terugknop{border:0;background:none;padding:0;margin:0 0 10px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .rol{margin:0 0 12px}
  .rol .dienstnaam{margin:0;font-size:12px;font-weight:800;text-transform:uppercase}
  .rol .functie{margin:0 0 4px;font-weight:700}
  .rol p{margin:0 0 6px;font-size:15px}
  .rol + .rol{padding-top:12px;border-top:2px solid var(--grijs)}

  /* contact */
  .contact{margin-top:14px;background:var(--blauw);color:var(--wit);border-radius:22px;padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .contact span{font-weight:600;font-size:15px}
  .knop{display:inline-block;background:var(--groen);color:var(--blauw);border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
  .knop.wit{background:var(--wit)}
  .knop.uit{background:transparent;color:var(--wit);border:2px dashed var(--wit);cursor:default}
  .knop.lijn{background:var(--wit);color:var(--blauw);border:2px solid var(--blauw)}

  /* fiche (mensen zonder plek op het plan) */
  dialog.fiche{border:0;border-left:8px solid var(--groen);border-radius:28px;padding:22px 24px;width:min(480px,calc(100% - 32px));max-height:85vh;overflow:auto;color:var(--blauw)}
  dialog.fiche::backdrop{background:rgba(6,3,141,.65)}

  @media (max-width:900px){
    .keuze{grid-template-columns:1fr}
    .chev{display:none}
    .scherm{height:auto;min-height:100vh;grid-template-rows:auto auto}
    .top{flex-wrap:wrap;padding:12px 14px;gap:10px}
    .plaats{order:-1;flex-basis:calc(100% - 50px)}
    .top .veld{flex:1;width:auto;min-width:0}
    .top .voorstel{left:0;width:auto}
    .kaart{display:flex;flex-direction:column;overflow:hidden}
    .kaart svg{position:static;height:auto;order:2}
    .lift{position:static;order:1;margin:12px;align-self:flex-start;flex-wrap:wrap;max-width:calc(100% - 24px);gap:8px}
    .schacht{flex-direction:row}
    .knoppen{flex-direction:row-reverse}
    .schacht + .schacht{border-left:0;padding-left:0}
    .schacht span{max-width:70px}
    .kleuren{position:static;order:3;align-items:flex-start;margin:8px 12px}
    #info{order:4;display:flex;flex-direction:column}
    .kaartje,.open-kaartje{position:relative;bottom:auto;left:auto;right:auto;width:auto;margin:8px 12px 20px;max-height:none}
    .open-kaartje{align-self:flex-start}
    .kaartje ul{grid-template-columns:1fr}
    .kaartje.links,.kaartje.rechts{left:auto;right:auto}
    html,body{overflow-x:hidden;height:auto}
  }
  @media (prefers-reduced-motion:reduce){ .ring{animation:none;opacity:.8} *{transition:none!important} }
</style>
</head>

function slug(s){return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function norm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

  if(bureau && !m.bureau) m.bureau=bureau;
  m.rollen.push({dienst,functie,tekst:tekst||""});

/* ---------- zoekveld met voorstellen (herbruikbaar) ---------- */
function zoekVeld(input, lijst, bron){
  let items=[], actief=-1;
  const sluit=()=>{lijst.hidden=true; input.setAttribute("aria-expanded","false"); actief=-1; input.removeAttribute("aria-activedescendant");};
  const toon=()=>{
    const q=norm(input.value.trim());
    if(!q){ sluit(); return; }
    items=bron(q);
    actief=items.length?0:-1;
    lijst.innerHTML = items.length
      ? items.map((it,i)=>`<li role="option" id="${lijst.id}-${i}" data-i="${i}" aria-selected="${i===actief}">
          <span><b>${esc(it.titel)}</b><small>${esc(it.sub)}</small></span><span class="plek">${esc(it.plek)}</span></li>`).join("")
      : `<li class="niets">Niemand gevonden voor “${esc(input.value.trim())}”. Controleer de spelling, of zoek via “Een vraag”.</li>`;
    lijst.hidden=false; input.setAttribute("aria-expanded","true"); markeer();
  };
  const markeer=()=>{
    lijst.querySelectorAll("[role=option]").forEach((li,i)=>li.setAttribute("aria-selected",i===actief));
    if(actief>=0){ input.setAttribute("aria-activedescendant",`${lijst.id}-${actief}`); $(`${lijst.id}-${actief}`).scrollIntoView({block:"nearest"}); }
  };
  const kies=i=>{ const it=items[i]; if(!it) return; input.value=""; sluit(); input.blur(); it.actie(); };
  input.addEventListener("input",toon);
  input.addEventListener("focus",toon);
  input.addEventListener("blur",()=>setTimeout(sluit,120));
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"&&items.length){e.preventDefault(); actief=(actief+1)%items.length; markeer();}
    else if(e.key==="ArrowUp"&&items.length){e.preventDefault(); actief=(actief-1+items.length)%items.length; markeer();}
    else if(e.key==="Enter"){e.preventDefault(); kies(actief);}
    else if(e.key==="Escape"){input.value=""; sluit();}
  });
  lijst.addEventListener("mousedown",e=>{ const li=e.target.closest("[data-i]"); if(li){e.preventDefault(); kies(+li.dataset.i);} });
}
function zoekMensen(q){
  return MENSEN.filter(m=>norm(m.naam).split(" ").some(w=>w.startsWith(q)) || norm(m.naam).includes(q))
    .slice(0,8).map(m=>({titel:m.naam, sub:functies(m), plek:plekVan(m), actie:()=>kiesPersoon(m.id)}));
}
function zoekBureaus(q){
  return BUREAUS.filter(b=>norm(b.naam).includes(q) || mensenIn(b.id).some(m=>norm(functies(m)).includes(q)))
    .slice(0,5).map(b=>({titel:b.naam, sub:aantal(mensenIn(b.id).length), plek:plekTekst(b.plan), actie:()=>kiesBureau(b.id)}));
}
zoekVeld($("start-q"),$("start-lijst"),zoekMensen);
zoekVeld($("top-q"),$("top-lijst"),q=>[...zoekMensen(q).slice(0,6),...zoekBureaus(q)]);

/* ---------- "Een vraag": zoeken in wat mensen doen ---------- */
function termenUit(q){
  return norm(q).split(/[^a-z0-9-]+/).filter(w=>w.length>=3 && !STOP.has(w))
    .map(w=>SYNONIEMEN[w] || (w.length>6 ? w.replace(/(en|s)$/,"") : w));
}
function zinnen(tekst){ return tekst.replace(/\n/g," ").split(/(?<=[.!?…])\s+/); }
function markeerZin(zin,termen){
  return zin.split(/(\s+)/).map(w=>termen.some(t=>!t.includes(" ") && norm(w).includes(t)) ? `<mark>${esc(w)}</mark>` : esc(w)).join("");
}
function zoekVraag(termen){
  const groepen=new Map();
  INDEX.forEach(e=>{
    const eigen=termen.filter(t=>e.eigen.includes(t)), dienst=termen.filter(t=>e.dienstTekst.includes(t));
    if(!eigen.length && !dienst.length) return;
    let g=groepen.get(e.dienst);
    if(!g){ g={dienst:e.dienst,termen:new Set(),voor:[],na:[],zin:null}; groepen.set(e.dienst,g); }
    [...eigen,...dienst].forEach(t=>g.termen.add(t));
    const lijst = eigen.length ? g.voor : g.na;
    if(!g.voor.includes(e.m) && !g.na.includes(e.m)) lijst.push(e.m);
    if(!g.zin){
      const bron = eigen.length ? (e.rol.tekst||e.rol.functie) : DIENSTEN[e.dienst].tekst;
      g.zin = zinnen(bron).find(z=>termen.some(t=>norm(z).includes(t))) || zinnen(bron)[0];
    }
  });
  return [...groepen.values()].map(g=>({...g,mensen:[...g.voor,...g.na]}))
    .sort((a,b)=>b.termen.size-a.termen.size || b.voor.length-a.voor.length);
}
function toonVraag(termen, label){
  const uit=$("vraag-res");
  if(!termen.length){ uit.innerHTML=""; return; }
  const res=zoekVraag(termen).slice(0,6);
  uit.innerHTML = res.length ? res.map(g=>`
    <article class="resultaat">
      <h3>${esc(DIENSTEN[g.dienst].naam)}</h3>
      <p>${markeerZin(g.zin,termen)}</p>
      <div class="chips">${g.mensen.map(m=>`<button class="chip" data-persoon="${m.id}">${esc(m.naam)}</button>`).join("")}</div>
    </article>`).join("")
    : `<p class="geenres">Niets gevonden voor “${esc(label)}”. Probeer een ander woord of kies een onderwerp hierboven.</p>`;
}
$("onderwerpen").innerHTML = ONDERWERPEN.map(([l],i)=>`<button data-onderwerp="${i}" aria-pressed="false">${esc(l)}</button>`).join("");
$("onderwerpen").addEventListener("click",e=>{
  const b=e.target.closest("[data-onderwerp]"); if(!b) return;
  const [label,termen]=ONDERWERPEN[+b.dataset.onderwerp];
  document.querySelectorAll("[data-onderwerp]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("vraag-q").value=label; toonVraag(termen,label);
});
$("vraag-q").addEventListener("input",e=>{
  document.querySelectorAll("[data-onderwerp]").forEach(x=>x.setAttribute("aria-pressed","false"));
  toonVraag(termenUit(e.target.value), e.target.value.trim());
});

/* ---------- startpagina ---------- */
function zetModus(m){
  ["naam","vraag","dienst"].forEach(k=>{ $("kies-"+k).setAttribute("aria-pressed",k===m); $("modus-"+k).hidden=k!==m; });
  if(m==="naam") $("start-q").focus();
  if(m==="vraag") $("vraag-q").focus();
}
$("kies-naam").onclick=()=>zetModus("naam");
$("kies-vraag").onclick=()=>zetModus("vraag");
$("kies-dienst").onclick=()=>zetModus("dienst");
$("diensten").innerHTML = ["Pieter Behaeghel","Voorgebouw"].map(g=>
  `<p class="gebouwkop">${g}</p>` + BUREAUS.filter(b=>PL[b.plan].gebouw===g).map(b=>
    `<button class="dienst" data-bureau="${b.id}"><b>${esc(b.naam)}</b><span>${hoofdletter(verdiepNaam(PL[b.plan].verdiep))}, ${aantal(mensenIn(b.id).length)}</span></button>`).join("")
).join("") + `<p class="gebouwkop">Geen vaste plek op deze plannen</p>` +
  MENSEN.filter(m=>!m.bureau).map(m=>`<button class="dienst" data-persoon="${m.id}"><b>${esc(m.naam)}</b><span>${esc(functies(m))}</span></button>`).join("");

/* ---------- liftpaneel ---------- */
$("lift").innerHTML=[["vg","Voorgebouw"],["pb","Pieter Behaeghel"]].map(([k,naam])=>`
  <div class="schacht">
    <div class="knoppen">${[2,1,0].map(v=>`<button class="vloer" data-plan="${k}${v}" aria-label="${naam}, ${verdiepNaam(v)}" aria-pressed="false">${v}</button>`).join("")}</div>
    <span>${naam}</span>
  </div>`).join("");
$("lift").addEventListener("click",e=>{
  const b=e.target.closest(".vloer"); if(!b) return;
  Object.assign(state,{plan:b.dataset.plan,bureau:null,persoon:null,kaartjeDicht:false}); render();
});
$("kleuren-knop").onclick=()=>{
  const l=$("kleuren-lijst"); l.hidden=!l.hidden; $("kleuren-knop").setAttribute("aria-expanded",!l.hidden);
};

/* ---------- plan ---------- */
function vorm(b,attr){
  if(b.r) return `<rect ${attr} data-bureau="${b.id}" x="${b.r[0]}" y="${b.r[1]}" width="${b.r[2]}" height="${b.r[3]}" rx="3"><title>${esc(b.naam)}</title></rect>`;
  return `<polygon ${attr} data-bureau="${b.id}" points="${b.p.map(q=>q.join(",")).join(" ")}"><title>${esc(b.naam)}</title></polygon>`;
}
function midden(b){
  if(b.r) return [b.r[0]+b.r[2]/2, b.r[1]+b.r[3]/2, Math.max(b.r[2],b.r[3])];
  const xs=b.p.map(q=>q[0]), ys=b.p.map(q=>q[1]);
  return [(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2, Math.max(...xs)-Math.min(...xs)];
}
function tekenPlan(){
  const p=PL[state.plan], svg=$("svg"), [x,y,w,h]=p.vb;
  svg.setAttribute("viewBox",`${x} ${y} ${w} ${h}`);
  svg.classList.toggle("leeg",!p.img);
  const gekozen=state.bureau && bureauVan(state.bureau);
  let s = p.img
    ? `<image href="${p.img}" x="${x}" y="${y}" width="${w}" height="${h}"/>`
    : `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff"/><text x="${x+w/2}" y="${y+h-30}" text-anchor="middle" fill="#06038D" font-size="22" font-family="Poppins,sans-serif">Plan ontbreekt: zet plannen.js naast index.html</text>`;
  if(p.img){
    s+= state.plan.startsWith("vg")
      ? `<rect x="${x}" y="${y}" width="92" height="100" fill="#fff"/>`
      : state.plan==="pb0"
        ? `<rect x="0" y="0" width="276" height="60" fill="#fff"/><rect x="0" y="60" width="215" height="42" fill="#fff"/>`
        : `<rect x="0" y="0" width="300" height="100" fill="#fff"/>`;
  }
  if(gekozen){
    const gat = vorm(gekozen,'fill="#000"') + (gekozen.e?`<rect x="${gekozen.e[0]-4}" y="${gekozen.e[1]-4}" width="${gekozen.e[2]+8}" height="${gekozen.e[3]+8}" fill="#000"/>`:"");
    s+=`<defs><mask id="gat"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff"/>${gat}</mask></defs>
        <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" opacity=".6" mask="url(#gat)" pointer-events="none"/>`;
  }
  BUREAUS.filter(b=>b.plan===state.plan).forEach(b=>{
    s+=vorm(b,`class="zone${b.id===state.bureau?" gekozen":""}"`);
    if(b.e) s+=`<rect class="zone" data-bureau="${b.id}" x="${b.e[0]}" y="${b.e[1]}" width="${b.e[2]}" height="${b.e[3]}"><title>${esc(b.naam)}</title></rect>`;
  });
  if(gekozen){
    if(gekozen.e) s+=`<rect class="etiket-rand" x="${gekozen.e[0]-3}" y="${gekozen.e[1]-3}" width="${gekozen.e[2]+6}" height="${gekozen.e[3]+6}" pointer-events="none"/>`;
    const [cx,cy,d]=midden(gekozen);
    s+=`<circle class="ring" cx="${cx}" cy="${cy}" r="${Math.max(d*.75,40)}" pointer-events="none"/>`;
  }
  svg.innerHTML=s;
}

/* ---------- inhoud van kaartje en fiche ---------- */
function persoonHTML(m, opPlan){
  const b = m.bureau && bureauVan(m.bureau);
  return `${opPlan?`<button class="terugknop" data-terug>Iedereen in dit bureau</button>`:""}
    <h3 id="${opPlan?"":"fiche-titel"}">${esc(m.naam)}</h3>
    <p class="waar">${b ? esc(b.naam)+", "+esc(plekTekst(b.plan)) : "Geen vaste plek op deze plannen (na te kijken)"}</p>
    ${m.rollen.map(r=>{
      const d=DIENSTEN[r.dienst], toonDienst = norm(d.naam)!==norm(r.functie);
      return `<div class="rol">
        ${toonDienst?`<p class="dienstnaam">${esc(d.naam)}</p>`:""}
        <p class="functie">${esc(r.functie)}</p>
        ${r.tekst?alinea(r.tekst):""}
        ${d.tekst ? (r.tekst ? `<details class="info"><summary>Over de dienst</summary>${alinea(d.tekst)}</details>` : alinea(d.tekst)) : ""}
      </div>`;}).join("")}
    ${!opPlan && b ? `<button class="knop lijn" data-toon="${m.id}">Toon op het plan</button>` : ""}
    ${contactHTML(voornaam(m))}`;
}
function bureauHTML(b){
  // rollen van mensen in dit bureau, gegroepeerd per dienst (volgorde zoals in ROLLEN)
  const groepen=[];
  MENSEN.filter(m=>m.bureau===b.id).forEach(m=>m.rollen.forEach(rol=>{
    let g=groepen.find(x=>x.dienst===rol.dienst); if(!g){ g={dienst:rol.dienst,rij:[]}; groepen.push(g); }
    g.rij.push({m,rol});
  }));
  const meerdere = groepen.length>1;
  return `<h3>${esc(b.naam)}</h3><p class="waar">${esc(plekTekst(b.plan))}</p>
    <p class="tip">Klik op een naam om te lezen wat die collega doet.</p>
    ${groepen.map(g=>{
      const d=DIENSTEN[g.dienst];
      return `<section class="groep">
        ${meerdere || norm(d.naam)!==norm(b.naam) ? `<h4>${esc(d.naam)}</h4>` : ""}
        ${d.tekst?`<details class="info"><summary>Waarvoor kan je bij hen terecht?</summary>${alinea(d.tekst)}</details>`:""}
        <ul class="${g.rij.length<3?"een":""}">${g.rij.map(({m,rol})=>`<li><button data-open="${m.id}"><b>${esc(m.naam)}</b>${norm(rol.functie)!==norm(d.naam)?`<small>${esc(rol.functie)}</small>`:""}</button></li>`).join("")}</ul>
      </section>`;}).join("")}
    ${NOTEN[b.id]?`<p class="noot">${esc(NOTEN[b.id])}</p>`:""}
    ${contactHTML("hen")}`;
}
function tekenInfo(){
  const el=$("info");
  if(state.kaartjeDicht){
    el.innerHTML=`<button class="open-kaartje" id="open-kaartje">${state.bureau?"Toon wie hier zit":"Toon bureaus op dit verdiep"}</button>`;
    return;
  }
  let kant="links";
  if(state.bureau){
    const b=bureauVan(state.bureau), [x0,,w]=PL[b.plan].vb, [cx]=midden(b);
    if(!b.e && cx < x0+w/2) kant="rechts";
    if(b.e && b.e[0] < x0+w/2 - 100) kant="rechts";
  }
  const dicht=`<button class="dicht" data-dicht aria-label="Verbergen">×</button>`;
  if(!state.bureau){
    const hier=BUREAUS.filter(b=>b.plan===state.plan);
    el.innerHTML=`<div class="kaartje ${kant}">${dicht}
      <h3>Op dit verdiep</h3><p class="waar">Klik op een bureau op het plan of kies hieronder.</p>
      <div class="chips">${hier.map(b=>`<button class="chip" data-bureau="${b.id}">${esc(b.naam)}</button>`).join("")}</div></div>`;
    return;
  }
  const m = state.persoon && persoon(state.persoon);
  el.innerHTML=`<div class="kaartje ${kant}">${dicht}${ m && m.bureau===state.bureau ? persoonHTML(m,true) : bureauHTML(bureauVan(state.bureau)) }</div>`;
  el.querySelector(".kaartje").scrollTop=0;
}
function openFiche(m){
  const f=$("fiche");
  f.innerHTML=`<button class="dicht" data-fichedicht aria-label="Sluiten">×</button>${persoonHTML(m,false)}`;
  if(!f.open) f.showModal();
}

/* ---------- schermen ---------- */
function render(){
  const opStart = state.scherm==="start";
  $("start").hidden=!opStart; $("scherm").hidden=opStart;
  if(opStart){ history.replaceState(null,"","#"); return; }
  const p=PL[state.plan], b=state.bureau && bureauVan(state.bureau);
  const m=state.persoon && persoon(state.persoon);
  $("titel").textContent = m ? m.naam : b ? b.naam : p.gebouw;
  $("subtitel").textContent = (m && b ? b.naam+", " : "") + plekTekst(state.plan);
  document.querySelectorAll(".vloer").forEach(k=>{
    k.setAttribute("aria-pressed",k.dataset.plan===state.plan);
    k.classList.toggle("doel",!!b && b.plan===k.dataset.plan);
  });
  tekenPlan(); tekenInfo();
  history.replaceState(null,"", m ? "#"+m.id : b ? "#bureau-"+b.id : "#"+state.plan);
}
function kiesBureau(id,persoonId=null){
  const b=bureauVan(id); if(!b) return;
  Object.assign(state,{scherm:"kaart",bureau:id,persoon:persoonId,plan:b.plan,kaartjeDicht:false}); render(); window.scrollTo(0,0);
}
function kiesPersoon(id){
  const m=persoon(id); if(!m) return;
  if(m.bureau) kiesBureau(m.bureau,m.id); else openFiche(m);
}

document.addEventListener("click",e=>{
  if(e.target.closest("[data-dicht]")){ state.kaartjeDicht=true; tekenInfo(); return; }
  if(e.target.closest("#open-kaartje")){ state.kaartjeDicht=false; tekenInfo(); return; }
  if(e.target.closest("[data-fichedicht]")){ $("fiche").close(); return; }
  if(e.target.closest("[data-terug]")){ state.persoon=null; render(); return; }
  const open=e.target.closest("[data-open]");
  if(open){ state.persoon=open.dataset.open; render(); return; }
  const toon=e.target.closest("[data-toon]");
  if(toon){ $("fiche").close(); kiesPersoon(toon.dataset.toon); return; }
  const t=e.target.closest("[data-persoon],[data-bureau]"); if(!t) return;
  if(t.dataset.persoon) kiesPersoon(t.dataset.persoon); else kiesBureau(t.dataset.bureau);
});
$("fiche").addEventListener("click",e=>{ if(e.target===$("fiche")) $("fiche").close(); });
$("terug").onclick=()=>{ Object.assign(state,{scherm:"start",bureau:null,persoon:null}); render(); zetModus("naam"); };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && state.scherm==="kaart" && !$("fiche").open && document.activeElement!==$("top-q")) $("terug").click();
});

(function start(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(MENSEN.some(m=>m.id===h && m.bureau)) return kiesPersoon(h);
  if(h.startsWith("bureau-") && bureauVan(h.slice(7))) return kiesBureau(h.slice(7));
  if(PL[h]) { Object.assign(state,{scherm:"kaart",plan:h}); return render(); }
  render(); $("start-q").focus();
})();
</script>
