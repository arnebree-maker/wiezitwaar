<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie zoek je? Algemene diensten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blauw:#0017AC; --blauw-diep:#000E6B; --lime:#80FF00;
    --papier:#FFFFFF; --mist:#EEF1FA; --lijn:#D5DBEE; --tekst:#141A3A; --zacht:#5A6285;
    --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;
    --top:68px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--tekst);background:var(--papier);font-size:16px;line-height:1.45}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--lime);outline-offset:2px}

  /* ================= STARTPAGINA ================= */
  .start{min-height:100vh;background:var(--blauw);color:#fff;display:flex;justify-content:center;padding:9vh 24px 48px}
  .start-binnen{width:100%;max-width:880px}
  .start .boven{margin:0 0 10px;color:#C9D0F5;font-size:17px}
  .start h1{margin:0;font-size:clamp(52px,9vw,104px);line-height:.95;font-weight:800;letter-spacing:-.03em}
  .start h1::after{content:"";display:block;width:96px;height:12px;background:var(--lime);margin-top:22px}

  .keuze{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:40px 0 22px}
  .keuze button{border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:16px;padding:18px 22px;
    text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
  .keuze button:hover{border-color:#fff}
  .keuze button b{display:block;font-size:24px;font-weight:800;line-height:1.1}
  .keuze button span{font-size:15px;opacity:.8}
  .keuze button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--blauw-diep)}
  .keuze button[aria-pressed="true"] span{opacity:.85}

  .veld{position:relative}
  .veld input{width:100%;padding:20px 22px;border-radius:14px;border:3px solid transparent;font:inherit;font-size:22px;
    color:var(--tekst);background:#fff}
  .veld input:focus{outline:none;border-color:var(--lime)}
  .voorstel{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;color:var(--tekst);border-radius:14px;
    list-style:none;margin:0;padding:6px;box-shadow:0 18px 40px rgba(0,8,60,.35);z-index:30;max-height:min(60vh,440px);overflow:auto}
  .voorstel li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 14px;border-radius:10px;cursor:pointer}
  .voorstel li b{font-weight:800;display:block}
  .voorstel li small{color:var(--zacht);font-size:14px}
  .voorstel li .plek{color:var(--zacht);font-size:14px;white-space:nowrap;text-align:right}
  .voorstel li[aria-selected="true"]{background:var(--mist)}
  .voorstel li[aria-selected="true"] b{color:var(--blauw)}
  .voorstel .niets{cursor:default;color:var(--zacht)}
  .hint{margin:14px 2px 0;color:#C9D0F5;font-size:15px}

  .diensten{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:4px}
  .gebouwkop{grid-column:1/-1;margin:18px 0 0;font-size:15px;color:#C9D0F5;font-weight:600}
  .dienst{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;
    display:flex;flex-direction:column;gap:2px;transition:background .15s}
  .dienst:hover{background:var(--lime);color:var(--blauw-diep)}
  .dienst b{font-weight:800;font-size:17px;line-height:1.2}
  .dienst span{font-size:14px;opacity:.8}

  /* ================= KAARTSCHERM ================= */
  .scherm{height:100vh;display:grid;grid-template-rows:var(--top) 1fr;background:var(--mist)}
  .top{background:var(--blauw);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px}
  .terug{border:2px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;
    font-weight:600;white-space:nowrap}
  .terug:hover{border-color:#fff}
  .plaats{flex:1;min-width:0}
  .plaats h2{margin:0;font-size:22px;line-height:1.1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plaats p{margin:2px 0 0;font-size:14px;color:#C9D0F5}
  .top .veld{width:340px}
  .top .veld input{padding:10px 14px;font-size:16px;border-width:2px;border-radius:10px}
  .top .voorstel{left:auto;width:420px;max-width:92vw}

  .kaart{position:relative;min-height:0;overflow:hidden;background:#fff}
  .kaart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .zone{fill:transparent;cursor:pointer;stroke:transparent;stroke-width:3}
  .zone:hover{stroke:var(--blauw);stroke-dasharray:8 5}
  .zone.gekozen{stroke:var(--blauw);stroke-width:6;stroke-dasharray:none;fill:rgba(128,255,0,.25)}
  .etiket-rand{fill:none;stroke:var(--lime);stroke-width:7}
  .ring{fill:none;stroke:var(--blauw);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:puls 1.6s ease-out 3 forwards}
  @keyframes puls{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.5)}}

  /* liftpaneel, zweeft linksboven over de plantitel */
  .lift{position:absolute;top:14px;left:14px;display:flex;gap:10px;background:#fff;border:1px solid var(--lijn);border-radius:14px;
    padding:10px 12px;box-shadow:0 6px 20px rgba(0,14,107,.1);z-index:5}
  .schacht{display:flex;flex-direction:column;align-items:center;gap:6px}
  .schacht + .schacht{border-left:1px solid var(--lijn);padding-left:10px}
  .knoppen{display:flex;flex-direction:column;gap:4px}
  .vloer{width:36px;height:36px;border-radius:50%;border:2px solid var(--blauw);background:#fff;color:var(--blauw);
    font-weight:800;font-size:16px;cursor:pointer;position:relative}
  .vloer:hover{background:var(--mist)}
  .vloer[aria-pressed="true"]{background:var(--blauw);color:var(--lime)}
  .vloer.doel::after{content:"";position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;
    background:var(--lime);border:2px solid var(--blauw)}
  .schacht span{font-size:12px;color:var(--zacht);font-weight:600;text-align:center;line-height:1.15;max-width:80px}

  /* kleuren: enkel op vraag */
  .kleuren{position:absolute;top:14px;right:14px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .kleuren > button{border:1px solid var(--lijn);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;
    font-weight:600;color:var(--blauw);box-shadow:0 6px 20px rgba(0,14,107,.1)}
  .kleuren ul{list-style:none;margin:0;padding:12px 14px;background:#fff;border:1px solid var(--lijn);border-radius:12px;
    font-size:14px;color:var(--zacht);box-shadow:0 6px 20px rgba(0,14,107,.1)}
  .kleuren li{padding:2px 0}
  .kleuren i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}

  /* infokaart, zweeft onderaan aan de kant weg van het bureau */
  .kaartje{position:absolute;bottom:16px;width:min(420px,calc(100% - 32px));background:#fff;border:1px solid var(--lijn);
    border-left:8px solid var(--lime);border-radius:14px;padding:16px 18px 16px 20px;box-shadow:0 10px 30px rgba(0,14,107,.14);z-index:6;
    max-height:calc(100% - 200px);overflow:auto}
  .kaartje.links{left:16px}.kaartje.rechts{right:16px}
  .kaartje h3{margin:0;font-size:21px;color:var(--blauw);line-height:1.15;padding-right:30px}
  .kaartje .waar{margin:3px 0 12px;color:var(--zacht);font-size:15px}
  .dicht{position:absolute;top:10px;right:10px;width:30px;height:30px;border:0;border-radius:8px;background:var(--mist);
    color:var(--blauw);cursor:pointer;font-size:18px;line-height:1}
  .kaartje ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  .kaartje ul.een{grid-template-columns:1fr}
  .kaartje li button{border:0;background:none;padding:4px 6px;margin:-4px -6px;border-radius:6px;text-align:left;cursor:pointer;width:100%}
  .kaartje li button:hover{background:var(--mist)}
  .kaartje li b{display:block;font-weight:600;line-height:1.25}
  .kaartje li small{color:var(--zacht);font-size:13px;line-height:1.2;display:block}
  .kaartje li.zelf b{font-weight:800;color:var(--blauw)}
  .kaartje li.zelf b::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--lime);
    border:2px solid var(--blauw);margin-right:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--blauw);background:#fff;color:var(--blauw);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:600}
  .chip:hover{background:var(--blauw);color:#fff}
  .noot{margin:12px 0 0;font-size:13px;color:var(--zacht)}
  .open-kaartje{position:absolute;bottom:16px;left:16px;z-index:6;border:0;background:var(--blauw);color:#fff;border-radius:999px;
    padding:10px 16px;cursor:pointer;font-weight:600;box-shadow:0 6px 20px rgba(0,14,107,.2)}

  @media (max-width:900px){
    .keuze{grid-template-columns:1fr}
    .scherm{height:auto;min-height:100vh;grid-template-rows:auto auto}
    .top{flex-wrap:wrap;padding:12px 14px;gap:10px}
    .plaats{order:-1;flex-basis:100%}
    .top .veld{flex:1;width:auto}
    .top .voorstel{left:0;width:auto}
    .kaart{display:flex;flex-direction:column;overflow:visible}
    .kaart svg{position:static;height:auto;order:2}
    .lift{position:static;order:1;margin:12px;align-self:flex-start;box-shadow:none}
    .schacht{flex-direction:row}
    .knoppen{flex-direction:row-reverse}
    .kleuren{position:static;order:3;align-items:flex-start;margin:8px 12px}
    .kaartje,.open-kaartje{position:static;order:4;width:auto;margin:8px 12px 20px;max-height:none;box-shadow:none}
    .open-kaartje{align-self:flex-start}
    .kaartje ul{grid-template-columns:1fr}
    .top .veld{min-width:0}
    #info{order:4;display:flex;flex-direction:column}
    .kaart{overflow:hidden}
    .lift{flex-wrap:wrap;max-width:calc(100% - 24px);gap:8px}
    .schacht span{max-width:70px}
    .kaartje{position:relative}
    .schacht + .schacht{border-left:0;padding-left:0}
    html,body{overflow-x:hidden}
  }
  @media (prefers-reduced-motion:reduce){ .ring{animation:none;opacity:.8} *{transition:none!important} }
</style>
</head>
<body>

<!-- ================= STARTPAGINA ================= -->
<section class="start" id="start">
  <div class="start-binnen">
    <p class="boven">Algemene diensten</p>
    <h1>Wie zoek je?</h1>

    <div class="keuze" role="group" aria-label="Zoek op">
      <button id="kies-naam" aria-pressed="true"><b>Een collega</b><span>Typ een voornaam of familienaam</span></button>
      <button id="kies-dienst" aria-pressed="false"><b>Een dienst</b><span>Kies uit de bureaus van de algemene diensten</span></button>
    </div>

    <div id="modus-naam">
      <div class="veld">
        <input id="start-q" type="text" autocomplete="off" placeholder="Bv. Lien of Van Damme" enterkeyhint="search"
               role="combobox" aria-expanded="false" aria-controls="start-lijst" aria-autocomplete="list" aria-label="Naam van een collega">
        <ul class="voorstel" id="start-lijst" role="listbox" hidden></ul>
      </div>
      <p class="hint">Kies een naam uit de lijst om te zien waar die collega zit.</p>
    </div>

    <div id="modus-dienst" hidden>
      <div class="diensten" id="diensten"></div>
    </div>
  </div>
</section>

<!-- ================= KAARTSCHERM ================= -->
<section class="scherm" id="scherm" hidden>
  <header class="top">
    <button class="terug" id="terug">← Wie zoek je?</button>
    <div class="plaats"><h2 id="titel"></h2><p id="subtitel"></p></div>
    <div class="veld">
      <input id="top-q" type="text" autocomplete="off" placeholder="Zoek iemand anders of een dienst" enterkeyhint="search"
             role="combobox" aria-expanded="false" aria-controls="top-lijst" aria-autocomplete="list" aria-label="Zoek een collega of dienst">
      <ul class="voorstel" id="top-lijst" role="listbox" hidden></ul>
    </div>
  </header>

  <div class="kaart" id="kaart">
    <svg id="svg" role="img" aria-labelledby="titel subtitel"></svg>
    <div class="lift" id="lift" role="group" aria-label="Kies gebouw en verdiep"></div>
    <div class="kleuren">
      <button id="kleuren-knop" aria-expanded="false" aria-controls="kleuren-lijst">Kleuren op het plan</button>
      <ul id="kleuren-lijst" hidden>
        <li><i style="background:#7ED957"></i>Algemene diensten</li>
        <li><i style="background:#FF5757"></i>MSR</li>
        <li><i style="background:#C7CDD5"></i>Vergader- en gedeelde ruimtes</li>
        <li><i style="background:#E0A8F0"></i>Torretjes</li>
      </ul>
    </div>
    <div id="info"></div>
  </div>
</section>

/* ---------- hulpfuncties ---------- */
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- zoekveld met voorstellen (herbruikbaar) ---------- */
function zoekVeld(input, lijst, bron){
  let items=[], actief=-1;
  const sluit=()=>{lijst.hidden=true; input.setAttribute("aria-expanded","false"); actief=-1; input.removeAttribute("aria-activedescendant");};
  const toon=()=>{
    const q=norm(input.value.trim());
    if(!q){ sluit(); return; }
    items=bron(q);
    actief=items.length?0:-1;
    lijst.innerHTML = items.length
      ? items.map((it,i)=>`<li role="option" id="${lijst.id}-${i}" data-i="${i}" aria-selected="${i===actief}">
          <span><b>${esc(it.titel)}</b><small>${esc(it.sub)}</small></span><span class="plek">${esc(it.plek)}</span></li>`).join("")
      : `<li class="niets">Niemand gevonden voor “${esc(input.value.trim())}”. Controleer de spelling of kies een dienst.</li>`;
    lijst.hidden=false; input.setAttribute("aria-expanded","true"); markeer();
  };
  const markeer=()=>{
    lijst.querySelectorAll("[role=option]").forEach((li,i)=>li.setAttribute("aria-selected",i===actief));
    if(actief>=0){ input.setAttribute("aria-activedescendant",`${lijst.id}-${actief}`); $(`${lijst.id}-${actief}`).scrollIntoView({block:"nearest"}); }
  };
  const kies=i=>{ const it=items[i]; if(!it) return; input.value=""; sluit(); input.blur(); it.actie(); };
  input.addEventListener("input",toon);
  input.addEventListener("focus",toon);
  input.addEventListener("blur",()=>setTimeout(sluit,120));
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"&&items.length){e.preventDefault(); actief=(actief+1)%items.length; markeer();}
    else if(e.key==="ArrowUp"&&items.length){e.preventDefault(); actief=(actief-1+items.length)%items.length; markeer();}
    else if(e.key==="Enter"){e.preventDefault(); kies(actief);}
    else if(e.key==="Escape"){input.value=""; sluit();}
  });
  lijst.addEventListener("mousedown",e=>{ const li=e.target.closest("[data-i]"); if(li){e.preventDefault(); kies(+li.dataset.i);} });
}
function zoekMensen(q){
  return MENSEN.filter(m=>norm(m.naam).split(" ").some(w=>w.startsWith(q)) || norm(m.naam).includes(q))
    .slice(0,8).map(m=>{const b=bureauVan(m.bureau);return {titel:m.naam, sub:hoofdletter(m.rol), plek:plekTekst(b.plan), actie:()=>kiesPersoon(m.id)}});
}
function zoekBureaus(q){
  return BUREAUS.filter(b=>norm(b.naam).includes(q) || mensenIn(b.id).some(m=>norm(m.rol).includes(q)))
    .slice(0,5).map(b=>({titel:b.naam, sub:aantal(mensenIn(b.id).length), plek:plekTekst(b.plan), actie:()=>kiesBureau(b.id)}));
}
zoekVeld($("start-q"),$("start-lijst"),zoekMensen);
zoekVeld($("top-q"),$("top-lijst"),q=>[...zoekMensen(q).slice(0,6),...zoekBureaus(q)]);

/* ---------- startpagina ---------- */
function zetModus(m){
  $("kies-naam").setAttribute("aria-pressed",m==="naam");
  $("kies-dienst").setAttribute("aria-pressed",m==="dienst");
  $("modus-naam").hidden = m!=="naam";
  $("modus-dienst").hidden = m!=="dienst";
  if(m==="naam") $("start-q").focus();
}
$("kies-naam").onclick=()=>zetModus("naam");
$("kies-dienst").onclick=()=>zetModus("dienst");
$("diensten").innerHTML = ["Pieter Behaeghel","Voorgebouw"].map(g=>
  `<p class="gebouwkop">${g}</p>` + BUREAUS.filter(b=>PLANNEN[b.plan].gebouw===g).map(b=>
    `<button class="dienst" data-bureau="${b.id}"><b>${esc(b.naam)}</b><span>${hoofdletter(verdiepNaam(PLANNEN[b.plan].verdiep))}, ${aantal(mensenIn(b.id).length)}</span></button>`).join("")
).join("");

/* ---------- liftpaneel ---------- */
$("lift").innerHTML=[["vg","Voorgebouw"],["pb","Pieter Behaeghel"]].map(([k,naam])=>`
  <div class="schacht">
    <div class="knoppen">${[2,1,0].map(v=>`<button class="vloer" data-plan="${k}${v}" aria-label="${naam}, ${verdiepNaam(v)}" aria-pressed="false">${v}</button>`).join("")}</div>
    <span>${naam}</span>
  </div>`).join("");
$("lift").addEventListener("click",e=>{
  const b=e.target.closest(".vloer"); if(!b) return;
  Object.assign(state,{plan:b.dataset.plan,bureau:null,persoon:null,kaartjeDicht:false}); render();
});

/* ---------- kleurenlegende ---------- */
$("kleuren-knop").onclick=()=>{
  const l=$("kleuren-lijst"); l.hidden=!l.hidden; $("kleuren-knop").setAttribute("aria-expanded",!l.hidden);
};

/* ---------- plan ---------- */
function vorm(b,attr){
  if(b.r) return `<rect ${attr} data-bureau="${b.id}" x="${b.r[0]}" y="${b.r[1]}" width="${b.r[2]}" height="${b.r[3]}" rx="3"><title>${esc(b.naam)}</title></rect>`;
  return `<polygon ${attr} data-bureau="${b.id}" points="${b.p.map(q=>q.join(",")).join(" ")}"><title>${esc(b.naam)}</title></polygon>`;
}
function midden(b){
  if(b.r) return [b.r[0]+b.r[2]/2, b.r[1]+b.r[3]/2, Math.max(b.r[2],b.r[3])];
  const xs=b.p.map(q=>q[0]), ys=b.p.map(q=>q[1]);
  return [(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2, Math.max(...xs)-Math.min(...xs)];
}
function tekenPlan(){
  const p=PLANNEN[state.plan], svg=$("svg"), [x,y,w,h]=p.vb;
  svg.setAttribute("viewBox",`${x} ${y} ${w} ${h}`);
  const gekozen=state.bureau && bureauVan(state.bureau);
  let s=`<image href="${p.img}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  // de titel die in de plannen zelf staat, verbergen (het liftpaneel en de balk tonen dit al)
  s+= state.plan.startsWith("vg")
    ? `<rect x="${x}" y="${y}" width="92" height="100" fill="#fff"/>`
    : state.plan==="pb0"
      ? `<rect x="0" y="0" width="276" height="60" fill="#fff"/><rect x="0" y="60" width="215" height="42" fill="#fff"/>`
      : `<rect x="0" y="0" width="300" height="100" fill="#fff"/>`;
  if(gekozen){
    const gat = vorm(gekozen,'fill="#000"') + (gekozen.e?`<rect x="${gekozen.e[0]-4}" y="${gekozen.e[1]-4}" width="${gekozen.e[2]+8}" height="${gekozen.e[3]+8}" fill="#000"/>`:"");
    s+=`<defs><mask id="gat"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff"/>${gat}</mask></defs>
        <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" opacity=".6" mask="url(#gat)" pointer-events="none"/>`;
  }
  BUREAUS.filter(b=>b.plan===state.plan).forEach(b=>{
    s+=vorm(b,`class="zone${b.id===state.bureau?" gekozen":""}"`);
    if(b.e) s+=`<rect class="zone" data-bureau="${b.id}" x="${b.e[0]}" y="${b.e[1]}" width="${b.e[2]}" height="${b.e[3]}"><title>${esc(b.naam)}</title></rect>`;
  });
  if(gekozen){
    if(gekozen.e) s+=`<rect class="etiket-rand" x="${gekozen.e[0]-3}" y="${gekozen.e[1]-3}" width="${gekozen.e[2]+6}" height="${gekozen.e[3]+6}" pointer-events="none"/>`;
    const [cx,cy,d]=midden(gekozen);
    s+=`<circle class="ring" cx="${cx}" cy="${cy}" r="${Math.max(d*.75,40)}" pointer-events="none"/>`;
  }
  svg.innerHTML=s;
}

/* ---------- infokaart ---------- */
function tekenInfo(){
  const el=$("info");
  if(state.kaartjeDicht){
    el.innerHTML=`<button class="open-kaartje" id="open-kaartje">${state.bureau?"Toon wie hier zit":"Toon bureaus op dit verdiep"}</button>`;
    return;
  }
  let kant="links";
  if(state.bureau){
    const b=bureauVan(state.bureau), [x0,,w]=PLANNEN[b.plan].vb, [cx]=midden(b);
    if(!b.e && cx < x0+w/2) kant="rechts";          // kaartje weg van het bureau
    if(b.e && b.e[0] < x0+w/2 - 100) kant="rechts";  // voorgebouw: weg van het kaderlabel
  }
  if(!state.bureau){
    const hier=BUREAUS.filter(b=>b.plan===state.plan);
    el.innerHTML=`<div class="kaartje ${kant}"><button class="dicht" data-dicht aria-label="Verbergen">×</button>
      <h3>Op dit verdiep</h3><p class="waar">Klik op een groen bureau of kies hieronder.</p>
      <div class="chips">${hier.map(b=>`<button class="chip" data-bureau="${b.id}">${esc(b.naam)}</button>`).join("")}</div></div>`;
    return;
  }
  const b=bureauVan(state.bureau), mensen=mensenIn(b.id);
  el.innerHTML=`<div class="kaartje ${kant}"><button class="dicht" data-dicht aria-label="Verbergen">×</button>
    <h3>${esc(b.naam)}</h3><p class="waar">${esc(plekTekst(b.plan))}</p>
    <ul class="${mensen.length<3?"een":""}">${mensen.map(m=>`<li class="${m.id===state.persoon?"zelf":""}"><button data-persoon="${m.id}"><b>${esc(m.naam)}</b>${norm(m.rol)!==norm(b.naam)?`<small>${esc(hoofdletter(m.rol))}</small>`:""}</button></li>`).join("")}</ul>
    ${NOTEN[b.id]?`<p class="noot">${esc(NOTEN[b.id])}</p>`:""}
  </div>`;
}

/* ---------- schermen ---------- */
function render(){
  const opStart = state.scherm==="start";
  $("start").hidden=!opStart; $("scherm").hidden=opStart;
  if(opStart){ history.replaceState(null,"","#"); return; }
  const p=PLANNEN[state.plan];
  const m=state.persoon && MENSEN.find(x=>x.id===state.persoon);
  $("titel").textContent = m ? m.naam : state.bureau ? bureauVan(state.bureau).naam : p.gebouw;
  $("subtitel").textContent = (state.bureau ? `${bureauVan(state.bureau).naam === $("titel").textContent ? "" : bureauVan(state.bureau).naam+", "}` : "") + plekTekst(state.plan);
  document.querySelectorAll(".vloer").forEach(k=>{
    k.setAttribute("aria-pressed",k.dataset.plan===state.plan);
    k.classList.toggle("doel",!!state.bureau && bureauVan(state.bureau).plan===k.dataset.plan);
  });
  tekenPlan(); tekenInfo();
  history.replaceState(null,"", state.persoon ? "#"+state.persoon : state.bureau ? "#bureau-"+state.bureau : "#"+state.plan);
}
function kiesBureau(id,persoon=null){
  const b=bureauVan(id); if(!b) return;
  Object.assign(state,{scherm:"kaart",bureau:id,persoon,plan:b.plan,kaartjeDicht:false}); render(); window.scrollTo(0,0);
}
function kiesPersoon(id){ const m=MENSEN.find(x=>x.id===id); if(m) kiesBureau(m.bureau,m.id); }

document.addEventListener("click",e=>{
  if(e.target.closest("[data-dicht]")){ state.kaartjeDicht=true; tekenInfo(); return; }
  if(e.target.closest("#open-kaartje")){ state.kaartjeDicht=false; tekenInfo(); return; }
  const t=e.target.closest("[data-persoon],[data-bureau]"); if(!t) return;
  if(t.dataset.persoon) kiesPersoon(t.dataset.persoon); else kiesBureau(t.dataset.bureau);
});
$("terug").onclick=()=>{ Object.assign(state,{scherm:"start",bureau:null,persoon:null}); render(); zetModus("naam"); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && state.scherm==="kaart" && document.activeElement!==$("top-q")) $("terug").click(); });

(function start(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(MENSEN.some(m=>m.id===h)) return kiesPersoon(h);
  if(h.startsWith("bureau-") && bureauVan(h.slice(7))) return kiesBureau(h.slice(7));
  if(PLANNEN[h]) { Object.assign(state,{scherm:"kaart",plan:h}); return render(); }
  render(); $("start-q").focus();
})();
</script>
</body>
</html>
